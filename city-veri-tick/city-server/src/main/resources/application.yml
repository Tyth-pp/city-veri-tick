server:
  port: 8082

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    driver-class-name: ${city.datasource.driver-class-name}
    url: jdbc:mysql://${city.datasource.host}:${city.datasource.port}/${city.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${city.datasource.username}
    password: ${city.datasource.password}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
  data:
    redis:
      timeout: 1s
      connect-timeout: 1s
      host: ${city.redis.host}
      port: ${city.redis.port}
      password: ${city.redis.password}
      database: 1
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000
          shutdown-timeout: 100

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true


city:
  oss:
    endpoint: ${city.oss.endpoint}
    bucket-name: ${city.oss.bucket-name}
    access-key-id: ${city.oss.access-key-id}
    access-key-secret: ${city.oss.access-key-secret}
    public-url: ${city.oss.public-url}
    object-prefix: "city-veri-tick/"
# JWT配置部分
  jwt:
  # JWT的密钥，用于签名和验证令牌
    secret: ${city.jwt.secret}
  # 令牌的有效期，设置为12小时
    ttl: ${city.jwt.ttl}
  # JWT的签发者标识
    issuer: ${city.jwt.issuer}
  # 黑名单前缀，用于存储已注销的令牌
    blacklist-prefix: ${city.jwt.blacklist-prefix}
  # 用户令牌前缀，用于存储用户相关的令牌信息
    user-tokens-prefix: ${city.jwt.user-tokens-prefix}



